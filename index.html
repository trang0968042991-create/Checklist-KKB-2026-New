<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist Công việc Khoa Khám bệnh | BV Sản Nhi Ninh Bình</title>
<style>
:root{
  --sw:260px;
  --ink:#1e1b4b;
  --pri:#4338ca;
  --pri2:#eef2ff;
  --acc:#f59e0b;
  --ok:#059669;
  --okbg:#d1fae5;
  --bad:#dc2626;
  --badbg:#fee2e2;
  --na:#64748b;
  --nabg:#e2e8f0;
  --warn:#b45309;
  --warnbg:#fef3c7;
  --line:#e2e4f3;
  --bg:#f4f5fb;
  --card:#fff;
  --mut:#5f6585;
  --sh:0 1px 3px rgba(30,27,75,.05),0 4px 16px rgba(30,27,75,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#e5e7ff;--pri:#a5b4fc;--pri2:#26285a;
    --ok:#34d399;--okbg:#064e3b;--bad:#f87171;--badbg:#521b1b;
    --na:#94a3b8;--nabg:#334155;--warn:#fcd34d;--warnbg:#4a3508;
    --line:#32355f;--bg:#0f1027;--card:#1a1c3c;--mut:#a3a8c8;
    --sh:0 1px 3px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.50px/1.5 Arial,Helvetica,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
svg{display:block}

/* Sidebar */
aside{position:fixed;inset:0 auto 0 0;width:var(--sw);background:linear-gradient(175deg,#1e1b4b 0%,#312e81 60%,#4c1d95 100%);color:#e0e7ff;display:flex;flex-direction:column;z-index:30;transition:transform .25s}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo{width:38px;height:38px;border-radius:11px;background:#f59e0b;display:grid;place-items:center;color:#1e1b4b;font-weight:bold;font-size:18px}
.brand b{display:block;font-size:15px;color:#fff;line-height:1.2}
.brand small{opacity:.75;font-size:11.5px}
.grp{font-size:10.5px;letter-spacing:.08em;opacity:.6;padding:14px 18px 4px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:11px;width:calc(100% - 20px);margin:2px 10px;padding:10px 12px;border:0;border-radius:10px;background:none;color:inherit;cursor:pointer;text-align:left;font-size:13.5px}
.nav:hover{background:rgba(255,255,255,.09)}
.nav.on{background:rgba(255,255,255,.18);color:#fff;font-weight:bold;box-shadow:inset 3px 0 0 #f59e0b}
.nav svg{flex:none;opacity:.85}
.sf{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.14);font-size:12.5px}

.ov{position:fixed;inset:0;background:rgba(15,16,39,.5);z-index:25;display:none}
.wrap{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.top h2{margin:0;font-size:18px;flex:1 1 180px}
.menu{display:none}
main{max-width:1280px;width:100%;margin:0 auto;padding:20px 24px 80px}

/* Controls */
select,input[type=date],input[type=text],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%}
textarea{width:100%;min-height:44px;resize:vertical}
.btn{border:1px solid var(--pri);background:var(--card);color:var(--pri);border-radius:10px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--pri2)}
.btn.fill{background:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.btn.fill{color:#0f1027}}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ok:hover{background:var(--okbg)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.bad:hover{background:var(--badbg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{padding:7px 10px}

/* Cards & Layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 20px;box-shadow:var(--sh)}
.card h3{margin:0 0 6px;font-size:16px}
.card h4.t{margin:0 0 10px;font-size:14px}
.mut{color:var(--mut);font-size:13px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;background:var(--pri2);color:var(--pri);font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.na{background:var(--nabg);color:var(--na)}

/* KPIs Grid */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:0 0 20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--pri))}
.kpi span{font-size:12px;color:var(--mut);font-weight:500}
.kpi b{display:block;font-size:28px;line-height:1.2;margin:4px 0 2px}
.kpi small{color:var(--mut);font-size:12px}

.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px;margin:0 0 20px}
.g2>.card{margin:0}

/* Progress & Bars */
.sb{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--nabg)}
.sb i{display:block;height:100%}
.prog{height:8px;border-radius:99px;background:var(--nabg);overflow:hidden;min-width:80px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#a855f7)}

/* Tables */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:10px 10px;text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--mut);background:#f8fafc;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
@media(prefers-color-scheme:dark){th{background:#232550}}
.tw{overflow-x:auto}

/* Checklist items */
.slot{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.slot:first-of-type{border-top:0;margin-top:0;padding-top:0}
.slot h4{margin:0 0 4px;font-size:14px;color:var(--pri)}
.std{font-size:13px;color:var(--mut);margin:2px 0 8px}
.task{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;padding:10px 12px;background:var(--bg);border-radius:10px;margin-bottom:8px;border:1px solid var(--line)}
.tt{flex:1 1 280px;font-size:13.5px}
.btns{display:flex;gap:5px}
.btns button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:12.5px;min-width:60px}
.btns button.on.d{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.btns button.on.f{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.btns button.on.n{background:var(--nabg);border-color:var(--na);color:var(--na)}
.rs{flex:1 0 100%}
.task.need .rs textarea{border-color:var(--bad)}

/* Banner */
.banner{border-radius:12px;padding:12px 16px;margin:0 0 20px;background:var(--warnbg);color:var(--warn);font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.banner.lock{background:var(--okbg);color:var(--ok)}

/* Footer bar */
.foot{position:fixed;bottom:0;left:var(--sw);right:0;background:var(--card);border-top:1px solid var(--line);padding:10px 24px;display:flex;gap:16px;align-items:center;z-index:9}
.foot .prog{flex:1}
.foot[hidden]{display:none}
.dc{display:flex;gap:6px;align-items:center}

#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50;font-size:13.5px}
#toast.show{opacity:.95}

@media (max-width:860px){
  aside{transform:translateX(-100%)}
  body.open aside{transform:none}
  body.open .ov{display:block}
  .wrap{margin-left:0}
  .menu{display:inline-flex}
  .top h2{flex:1 1 60%;font-size:16px}
  .dc{flex:1 1 100%}
  .dc input{flex:1}
  .foot{left:0}
  main,.top{padding-left:14px;padding-right:14px}
  .g2{grid-template-columns:1fr}
}
@media print{aside,.top,.foot,.btn,.ov{display:none!important}.wrap{margin:0}}
</style>
</head>
<body>
<aside id="side"></aside>
<div class="ov" id="ov"></div>
<div class="wrap">
  <div class="top" id="top"></div>
  <main id="app"></main>
</div>
<div class="foot" id="foot" hidden></div>
<div id="toast"></div>

<script>
let DB = JSON.parse(document.getElementById('cl-data').textContent);
let dt = new Date().toISOString().split('T')[0];
let view = 'rep'; 
let myPos = null;

let repFrom = '2026-11-02';
let repTo = new Date().toISOString().split('T')[0];

function gk(d){ return 'kkb_v3_' + d; }
function getStForDate(d){
  try{ return JSON.parse(localStorage.getItem(gk(d))) || {}; }catch(e){ return {}; }
}

function toast(m){
  let t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function fmtDate(d){
  let p = d.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d;
}

function init(){
  renderSide();
  renderTop();
  renderMain();
  renderFoot();
}

function renderSide(){
  let html = `
    <div class="brand">
      <div class="logo">✓</div>
      <div>
        <b>Checklist KKB</b>
        <small>BV Sản Nhi Ninh Bình</small>
      </div>
    </div>
    <div class="grp">NHÂN VIÊN</div>
    <button class="nav ${view==='chk'?'on':''}" onclick="setView('chk')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Checklist của tôi
    </button>
    <div class="grp">QUẢN LÝ & GIÁM SÁT</div>
    <button class="nav ${view==='dash'?'on':''}" onclick="setView('dash')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      Dashboard thống kê
    </button>
    <button class="nav ${view==='mon'?'on':''}" onclick="setView('mon')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Giám sát theo vị trí
    </button>
    <button class="nav ${view==='reassign'?'on':''}" onclick="setView('reassign')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      Phân công thay trực
    </button>
    <button class="nav ${view==='rep'?'on':''}" onclick="setView('rep')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Báo cáo & Xuất Excel
    </button>
    <div class="grp">ĐỒNG BỘ DỮ LIỆU</div>
    <button class="nav ${view==='sync'?'on':''}" onclick="setView('sync')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.73-5.73"/></svg>
      Sao lưu & Nhập JSON
    </button>
    <div class="sf">
      <div><b>Khoa Khám bệnh</b></div>
      <div style="opacity:.75">Ngày: ${fmtDate(dt)}</div>
    </div>
  `;
  document.getElementById('side').innerHTML = html;
}

function renderTop(){
  let titles = {
    chk: 'Checklist công việc cá nhân',
    dash: 'Dashboard thống kê hoạt động chi tiết',
    mon: 'Giám sát tiến độ & Phê duyệt vị trí',
    reassign: 'Quản lý phân công thay trực',
    rep: 'Báo cáo tổng hợp & Xuất dữ liệu',
    sync: 'Sao lưu & Đồng bộ dữ liệu JSON'
  };
  let html = `
    <button class="btn menu" onclick="toggleAside()">☰ Menu</button>
    <h2>${titles[view] || 'Quản lý Checklist'}</h2>
    <div class="dc">
      <button class="btn ib" onclick="shiftDate(-1)">&lt;</button>
      <input type="date" value="${dt}" onchange="dt=this.value;init()">
      <button class="btn ib" onclick="shiftDate(1)">&gt;</button>
      <button class="btn" onclick="setToday()">Hôm nay</button>
    </div>
  `;
  document.getElementById('top').innerHTML = html;
}

function toggleAside(){
  document.body.classList.toggle('open');
  let ov = document.getElementById('ov');
  ov.style.display = document.body.classList.contains('open') ? 'block' : 'none';
  ov.onclick = () => { document.body.classList.remove('open'); ov.style.display='none'; };
}

function setView(v){
  view = v;
  document.body.classList.remove('open');
  let ov = document.getElementById('ov');
  if(ov) ov.style.display = 'none';
  init();
}

function shiftDate(n){
  let d = new Date(dt);
  d.setDate(d.getDate() + n);
  dt = d.toISOString().split('T')[0];
  init();
}

function setToday(){
  dt = new Date().toISOString().split('T')[0];
  init();
}

function renderMain(){
  let el = document.getElementById('app');
  if(view === 'chk') el.innerHTML = buildChecklistView();
  else if(view === 'dash') el.innerHTML = buildDashboardView();
  else if(view === 'mon') el.innerHTML = buildMonitorView();
  else if(view === 'reassign') el.innerHTML = buildReassignView();
  else if(view === 'rep') el.innerHTML = buildReportView();
  else if(view === 'sync') el.innerHTML = buildSyncView();
}

// 1. Checklist cá nhân
function buildChecklistView(){
  let posOpts = '<option value="">— Chọn vị trí / Tên nhân viên —</option>';
  DB.positions.forEach(p => {
    let namesStr = p.names.join(' & ');
    posOpts += `<option value="${p.id}" ${myPos===p.id?'selected':''}>${p.position} (${namesStr})</option>`;
  });

  let html = `
    <div class="card">
      <h4 class="t">Chọn vị trí công tác của bạn</h4>
      <select onchange="myPos=this.value;renderMain()" style="width:100%;max-width:480px">${posOpts}</select>
    </div>
  `;

  if(!myPos){
    html += `<div class="card"><p class="mut">Vui lòng chọn vị trí công tác ở khung phía trên để hiển thị checklist công việc chi tiết trong ngày ${fmtDate(dt)}.</p></div>`;
    return html;
  }

  let pObj = DB.positions.find(x => x.id === myPos);
  let secObj = DB.sections.find(s => s.id === pObj.sec);
  let st = getStForDate(dt);

  html += `
    <div class="card">
      <span class="pill">${secObj.name}</span>
      <h3 style="margin-top:8px">${pObj.position}</h3>
      <p class="mut">Nhân sự phụ trách: <b>${pObj.names.join(', ')}</b></p>
  `;

  pObj.slots.forEach((slot, sIdx) => {
    html += `
      <div class="slot">
        <h4>⏰ Khung giờ: ${slot.time}</h4>
        <div class="std"><b>Tiêu chuẩn:</b> ${slot.std}</div>
    `;
    slot.tasks.forEach((tsk, tIdx) => {
      let key = `${pObj.id}_${sIdx}_${tIdx}`;
      let val = st[key] || {};
      let score = val.sc || ''; 
      let note = val.nt || '';

      html += `
        <div class="task ${score==='f'&&!note?'need':''}">
          <div class="tt">
            <div>• ${tsk}</div>
          </div>
          <div class="btns">
            <button class="${score==='d'?'on d':''}" onclick="setTask('${key}','d')">Đạt</button>
            <button class="${score==='f'?'on f':''}" onclick="setTask('${key}','f')">Không đạt</button>
            <button class="${score==='n'?'on n':''}" onclick="setTask('${key}','n')">KAD</button>
          </div>
          <div class="rs" ${score==='f'?'':'style="display:none"'}>
            <textarea placeholder="Nhập lý do không đạt / giải trình bắt buộc..." onchange="setNote('${key}',this.value)">${note}</textarea>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  });

  html += `</div>`;
  return html;
}

function setTask(key, sc){
  let st = getStForDate(dt);
  if(!st[key]) st[key] = {};
  if(st[key].sc === sc){
    delete st[key].sc;
  } else {
    st[key].sc = sc;
  }
  localStorage.setItem(gk(dt), JSON.stringify(st));
  renderMain();
  renderFoot();
}

function setNote(key, nt){
  let st = getStForDate(dt);
  if(!st[key]) st[key] = {};
  st[key].nt = nt;
  localStorage.setItem(gk(dt), JSON.stringify(st));
  renderFoot();
}

function computeStats(){
  let st = getStForDate(dt);
  let total = 0, d = 0, f = 0, n = 0;
  DB.positions.forEach(p => {
    p.slots.forEach((sl, sIdx) => {
      sl.tasks.forEach((ts, tIdx) => {
        total++;
        let k = `${p.id}_${sIdx}_${tIdx}`;
        if(st[k]){
          if(st[k].sc === 'd') d++;
          else if(st[k].sc === 'f') f++;
          else if(st[k].sc === 'n') n++;
        }
      });
    });
  });
  let done = d + f + n;
  let pct = total > 0 ? Math.round((done / total) * 100) : 0;
  let rateOk = done > 0 ? Math.round((d / done) * 100) : 0;
  return {total, d, f, n, done, pct, rateOk, un: total - done};
}

// 5. Báo cáo tổng hợp
function getDatesInRange(start, end) {
  let arr = [];
  let dtStart = new Date(start);
  let dtEnd = new Date(end);
  while (dtStart <= dtEnd) {
    arr.push(new Date(dtStart).toISOString().split('T')[0]);
    dtStart.setDate(dtStart.getDate() + 1);
  }
  return arr;
}

function buildReportView(){
  let dates = getDatesInRange(repFrom, repTo);

            else if(st[k].sc === 'f'){
              failCount++;
              if(!st[k].nt || st[k].nt.trim() === '') missingReason++;
            }
          }
        });
      });
    });
    let pRate = evaluated > 0 ? Math.round((okCount / evaluated) * 100) + '%' : '0%';
    csv += `${idx+1},"${p.position}","${p.names.join(', ')}",${evaluated},${pRate},${failCount},${missingReason}\n`;
  });
  let blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = `Bao_cao_tong_hop_${repFrom}_den_${repTo}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Đã xuất báo cáo CSV thành công!');
}

// 6. Sao lưu & Nhập JSON (Hợp nhất dữ liệu thông minh không lo mất dữ liệu)
function buildSyncView(){
  return `
    <div class="card">
      <h3>📤 Xuất toàn bộ dữ liệu (Sao lưu JSON)</h3>
      <p class="mut" style="margin-bottom:16px">Tải xuống toàn bộ lịch sử chấm checklist, phê duyệt và phân công thay trực của tất cả các ngày dưới dạng một file JSON để gửi cho người tổng hợp.</p>
      <button class="btn fill" onclick="exportFullJSON()">📥 Tải xuống file sao lưu (.json)</button>
    </div>

    <div class="card">
      <h3>📥 Nhập dữ liệu từ file khác (Hợp nhất thông minh)</h3>
      <p class="mut" style="margin-bottom:16px">Chọn file sao lưu (.json) do nhân viên gửi tới. Hệ thống sẽ <b>gộp thêm dữ liệu mới</b> vào kho sẵn có trên máy của bác sĩ chứ <b>không ghi đè hay làm mất dữ liệu hiện tại</b>.</p>
      
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <input type="file" id="importFile" accept=".json" style="padding:6px">
        <button class="btn ok" onclick="importFullJSON()">⚡ Nạp & Gộp dữ liệu vào hệ thống</button>
      </div>
    </div>
  `;
}

function exportFullJSON(){
  let backupData = {};
  for(let i=0; i<localStorage.length; i++){
    let key = localStorage.key(i);
    if(key.startsWith('kkb_v3_') || key.startsWith('kkb_reassign_')){
      backupData[key] = localStorage.getItem(key);
    }
  }
  let jsonStr = JSON.stringify(backupData, null, 2);
  let blob = new Blob([jsonStr], {type: 'application/json;charset=utf-8;'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = `Checklist_KKB_SaoLuu_${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Đã tải xuống file sao lưu JSON thành công!');
}

function importFullJSON(){
  let fileInput = document.getElementById('importFile');
  if(!fileInput.files || fileInput.files.length === 0){
    toast('Vui lòng chọn file .json trước khi nạp!');
    return;
  }
  let file = fileInput.files[0];
  let reader = new FileReader();
  reader.onload = function(e){
    try{
      let importedData = JSON.parse(e.target.result);
      let count = 0;
      for(let key in importedData){
        if(key.startsWith('kkb_v3_')){
          // SMART MERGE LOGIC: Merge checklist items key-by-key for each date
          let currentRaw = localStorage.getItem(key);
          let currentObj = currentRaw ? JSON.parse(currentRaw) : {};
          let importedObj = typeof importedData[key] === 'string' ? JSON.parse(importedData[key]) : importedData[key];
          
          let mergedObj = Object.assign({}, currentObj, importedObj);
          localStorage.setItem(key, JSON.stringify(mergedObj));
          count++;
        } else if(key.startsWith('kkb_reassign_')){
          // SMART MERGE LOGIC: Merge reassign lists without duplicates
          let currentRaw = localStorage.getItem(key);
          let currentList = currentRaw ? JSON.parse(currentRaw) : [];
          let importedList = typeof importedData[key] === 'string' ? JSON.parse(importedData[key]) : importedData[key];
          
          let mergedList = [...currentList];
          if(Array.isArray(importedList)){
            importedList.forEach(item => {
              if(!mergedList.some(x => x.pos===item.pos && x.off===item.off && x.on===item.on)){
                mergedList.push(item);
              }
            });
          }
          localStorage.setItem(key, JSON.stringify(mergedList));
          count++;
        }
      }
      toast(`Đã gộp thành công dữ liệu từ file vào hệ thống!`);
      setTimeout(()=>renderMain(), 800);
    }catch(err){
      toast('Lỗi: File JSON không đúng định dạng!');
    }
  };
  reader.readAsText(file);
}

function renderFoot(){
  let f = document.getElementById('foot');
  if(view !== 'chk' || !myPos){
    f.hidden = true;
    return;
  }
  let pObj = DB.positions.find(x => x.id === myPos);
  let st = getStForDate(dt);
  let tot=0, done=0;
  pObj.slots.forEach((sl, sIdx) => {
    sl.tasks.forEach((ts, tIdx) => {
      tot++;
      let k = `${pObj.id}_${sIdx}_${tIdx}`;
      if(st[k] && st[k].sc) done++;
    });
  });
  let pct = tot > 0 ? Math.round(done/tot*100) : 0;
  f.hidden = false;
  f.innerHTML = `
    <span>Tiến độ vị trí: <b>${done}/${tot} (${pct}%)</b></span>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <button class="btn fill ib" onclick="toast('Đã lưu và xác nhận hoàn thành checklist!')">Xác nhận hoàn thành</button>
  `;
}
